@if (loading.isLoading()) {
<div
  class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-indigo-950/90 backdrop-blur-sm"
>
  <div class="text-6xl animate-bounce mb-4">🚀</div>

  <p class="text-white font-black text-lg uppercase tracking-widest animate-pulse">
    Preparando a aventura...
  </p>

  <p class="text-indigo-300 text-xs mt-2 uppercase tracking-wide">Carregando mundos</p>
</div>
}
