<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-lg">
  <div
    class="bg-slate-900 border-2 border-indigo-500/50 rounded-3xl p-10 text-center max-w-md w-full shadow-2xl relative"
  >
    @if (confirm && showCancel) {
    <button
      (click)="onCancelClick()"
      class="absolute top-4 right-4 text-white text-xl font-bold hover:text-red-400"
    >
      ✖
    </button>
    }

    <h2 class="text-3xl uppercase mb-6 text-cyan-400 drop-shadow-lg animate-pulse">
      {{ title }}
    </h2>

    <p class="text-slate-200 mb-8">{{ message }}</p>

    @if (!confirm) {
    <button
      (click)="onButtonClick()"
      class="w-full bg-indigo-500 hover:bg-indigo-400 text-white py-4 rounded-2xl font-black text-xl uppercase"
    >
      {{ buttonText }}
    </button>
    } @if (confirm) {
    <div class="flex gap-4 justify-center">
      <button
        (click)="onButtonClick()"
        class="flex-1 bg-red-500 hover:bg-red-400 text-white py-4 rounded-2xl font-black text-xl uppercase"
      >
        {{ buttonText }}
      </button>

      @if (showCancel) {
      <button
        (click)="onCancelClick()"
        class="flex-1 bg-gray-500 hover:bg-gray-400 text-white py-4 rounded-2xl font-black text-xl uppercase"
      >
        Cancelar
      </button>
      }
    </div>
    }
  </div>
</div>
