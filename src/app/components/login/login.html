<div class="login-container">
  <div class="login-card">
    <header>
      <h1>Bem-vindo de volta!</h1>
      <p>Entre para continuar seus desafios</p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="loginWithEmail()">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="seu@email.com"
          [class.error]="email.invalid && email.touched">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" placeholder="Sua senha"
          [class.error]="password.invalid && password.touched">
      </div>

      <div class="error-message" *ngIf="errorMessage()">
        {{ errorMessage() }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading()">
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>

      <div class="divider">ou</div>

      <button type="button" class="btn-google" (click)="loginWithGoogle()">
        Entrar com Google
      </button>

      <div class="footer">
        Não tem conta? <a (click)="navigateToRegister()">Crie agora</a>
      </div>
    </form>
  </div>
</div>
