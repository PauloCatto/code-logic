<main
  class="min-h-screen w-full bg-slate-950 text-white flex items-center justify-center font-sans relative overflow-hidden"
>
  <div
    class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.04)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.04)_1px,transparent_1px)] [background-size:50px_50px]"
  ></div>

  <div class="absolute top-10 left-10 text-4xl animate-bounce opacity-40">⭐</div>
  <div class="absolute bottom-20 right-20 text-5xl animate-pulse opacity-40">🚀</div>

  <section
    class="relative z-10 w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-700 rounded-3xl p-8 shadow-2xl animate-fade-in"
  >
    <header class="text-center mb-8">
      <h1 class="text-4xl font-black tracking-tight uppercase">
        Code <span class="text-cyan-400">Adventure</span>
      </h1>
      <p class="mt-2 text-slate-400 text-sm">Faça login para acessar o painel adulto</p>
    </header>

    <button
      type="button"
      (click)="loginWithGoogle()"
      class="w-full flex items-center justify-center gap-3 bg-white text-slate-900 font-bold py-3 rounded-xl shadow-lg hover:scale-[1.03] active:scale-95 transition-all mb-6"
    >
      <span class="text-xl">🔐</span>
      Entrar com Google
    </button>

    <form [formGroup]="loginForm" (ngSubmit)="loginWithEmail()" class="flex flex-col gap-4">
      <input
        type="email"
        formControlName="email"
        placeholder="Email"
        class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
      />
      <div class="text-red-400 text-xs" *ngIf="email.invalid && (email.dirty || email.touched)">
        <span *ngIf="email.errors?.['required']">Email é obrigatório.</span>
        <span *ngIf="email.errors?.['email']">Email inválido.</span>
      </div>

      <input
        type="password"
        formControlName="password"
        placeholder="Senha"
        class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
      />
      <div
        class="text-red-400 text-xs"
        *ngIf="password.invalid && (password.dirty || password.touched)"
      >
        <span *ngIf="password.errors?.['required']">Senha é obrigatória.</span>
        <span *ngIf="password.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres.</span>
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading()"
        class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-black py-3 rounded-xl shadow-lg hover:scale-[1.03] active:scale-95 transition-all mt-2"
      >
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <footer class="mt-8 text-center text-xs text-slate-500">
      Painel Adulto • Gerencie perfis e desafios
    </footer>
  </section>
</main>
