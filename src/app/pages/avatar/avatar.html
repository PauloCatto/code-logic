<main class="min-h-screen w-full bg-slate-50 font-sans antialiased text-slate-900">
  
  <div class="flex flex-col lg:flex-row min-h-screen">
    
    <section class="flex-1 p-6 md:p-12 lg:p-20 flex flex-col justify-center">
      <div class="max-w-2xl w-full mx-auto lg:mx-0">
        <header class="mb-12">
          <span class="text-blue-600 font-black tracking-[0.3em] text-xs uppercase bg-blue-50 px-3 py-1 rounded-full">Fase de Preparação</span>
          <h1 class="text-4xl md:text-5xl font-black mt-4 tracking-tight">Crie seu <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Herói</span></h1>
          <p class="text-slate-500 mt-4 text-lg font-medium">Configure sua identidade antes de iniciar a jornada pelo mapa.</p>
        </header>

        <div class="space-y-10">
          <div class="group">
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3 ml-1 transition-colors group-focus-within:text-blue-500">
              Nome do Explorador
            </label>
            <input
              type="text"
              [value]="playerName()"
              (input)="updateName($event)"
              maxlength="12"
              placeholder="Ex: RoboX-99"
              class="w-full text-2xl md:text-3xl font-bold bg-transparent border-b-4 border-slate-200 py-4 focus:outline-none focus:border-blue-600 transition-all placeholder:text-slate-200"
            />
          </div>

          <div>
            <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-6 ml-1">
              Escolha seu Visual
            </label>
            <div class="grid grid-cols-3 sm:grid-cols-6 lg:grid-cols-3 xl:grid-cols-6 gap-4">
              @for (item of avatares; track item.id) {
                <button
                  (click)="select(item)"
                  class="group relative aspect-square rounded-2xl bg-white border-2 border-slate-100 flex items-center justify-center text-3xl md:text-4xl transition-all hover:shadow-xl hover:shadow-blue-900/5 hover:-translate-y-1 active:scale-95"
                  [class.border-blue-600]="selectedId() === item.id"
                  [class.bg-blue-50/30]="selectedId() === item.id"
                >
                  <span class="z-10">{{ item.icon }}</span>
                  @if (selectedId() === item.id) {
                    <div class="absolute inset-0 bg-blue-600/5 rounded-2xl border-2 border-blue-600"></div>
                  }
                </button>
              }
            </div>
          </div>

          <div class="pt-6 lg:hidden">
            <button
              (click)="confirmSelection()"
              [disabled]="!selectedId() || !playerName().trim()"
              class="w-full h-16 rounded-2xl bg-blue-600 text-white font-black text-xl shadow-2xl shadow-blue-200 disabled:bg-slate-200 disabled:shadow-none transition-all active:scale-95"
            >
              PRÓXIMO PASSO
            </button>
          </div>
        </div>
      </div>
    </section>

    <aside class="hidden lg:flex w-[40%] bg-white border-l border-slate-100 items-center justify-center p-12 relative overflow-hidden">
      <div class="absolute top-0 right-0 -mr-20 -mt-20 w-80 h-80 bg-blue-50 rounded-full blur-3xl opacity-50"></div>
      <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 bg-indigo-50 rounded-full blur-3xl opacity-50"></div>

      <div class="relative z-10 w-full max-w-sm text-center">
        <div class="bg-slate-50 rounded-[3rem] p-12 border border-white shadow-2xl">
          <div class="w-40 h-40 bg-white rounded-[2rem] mx-auto mb-8 shadow-inner border border-slate-100 flex items-center justify-center text-7xl ring-8 ring-white">
            {{ selectedAvatar()?.icon || '?' }}
          </div>
          <h3 class="text-3xl font-black text-slate-800 break-words">{{ playerName() || 'Seu Nome' }}</h3>
          <p class="text-blue-600 font-bold mt-2 uppercase tracking-tighter">Explorador Nível 1</p>
          
          <div class="mt-10 pt-10 border-t border-slate-200 flex justify-around">
            <div class="text-center">
              <p class="text-[10px] font-black text-slate-400 uppercase">Ataque</p>
              <p class="font-bold">10</p>
            </div>
            <div class="text-center">
              <p class="text-[10px] font-black text-slate-400 uppercase">Defesa</p>
              <p class="font-bold">05</p>
            </div>
            <div class="text-center">
              <p class="text-[10px] font-black text-slate-400 uppercase">Sorte</p>
              <p class="font-bold">99</p>
            </div>
          </div>
        </div>

        <button
          (click)="confirmSelection()"
          [disabled]="!selectedId() || !playerName().trim()"
          class="mt-12 w-full h-20 rounded-[2rem] bg-slate-900 text-white font-black text-xl shadow-2xl shadow-slate-300 hover:bg-blue-600 hover:shadow-blue-200 transition-all transform hover:-translate-y-1 disabled:bg-slate-100 disabled:text-slate-300 disabled:shadow-none"
        >
          CONFIRMAR E JOGAR 🚀
        </button>
      </div>
    </aside>

  </div>
</main>
