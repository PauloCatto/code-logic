<app-game-dialog
  *ngIf="showDialog()"
  [title]="dialogData().title"
  [message]="dialogData().message"
  [buttonText]="dialogData().buttonText"
  (close)="onDialogClose()"
></app-game-dialog>

<main
  class="min-h-screen w-full bg-slate-950 text-white flex items-center justify-center font-sans relative overflow-hidden"
>
  <div
    class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.05)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.05)_1px,transparent_1px)] [background-size:40px_40px]"
  ></div>

  <section class="relative z-10 w-full max-w-4xl px-6 flex flex-col items-center">
    <header class="mb-14 text-center">
      <h1 class="text-4xl md:text-6xl font-black tracking-tight uppercase">
        Code
        <span class="text-cyan-400">Adventure</span>
      </h1>
      <p class="mt-3 text-slate-400 text-sm md:text-base">Escolha como você quer entrar no jogo</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
      <button
        (click)="enterKidsMode()"
        class="group bg-emerald-600 hover:bg-emerald-500 transition-all rounded-3xl p-8 flex flex-col items-center text-center shadow-2xl border-4 border-emerald-800 hover:scale-[1.02]"
      >
        <div class="text-7xl mb-4 transition-transform group-hover:scale-110">🤖</div>

        <h2 class="text-2xl font-black uppercase mb-2">Modo Criança</h2>

        <p class="text-emerald-100 text-sm leading-relaxed mb-6">
          Resolver desafios, montar comandos
          <br />
          e ajudar o robô a avançar
        </p>

        <div
          class="mt-auto bg-black/30 px-6 py-3 rounded-full font-bold uppercase text-sm tracking-wider"
        >
          Jogar Agora
        </div>
      </button>

      <button
        class="group bg-indigo-600 hover:bg-indigo-500 transition-all rounded-3xl p-8 flex flex-col items-center text-center shadow-2xl border-4 border-indigo-800 hover:scale-[1.02]"
      >
        <div class="text-7xl mb-4 transition-transform group-hover:scale-110">🧠</div>

        <h2 class="text-2xl font-black uppercase mb-2">Modo Adulto</h2>

        <p class="text-indigo-100 text-sm leading-relaxed mb-6">
          Acompanhar progresso,
          <br />
          criar desafios e gerenciar perfis
        </p>

        <div
          class="mt-auto bg-black/30 px-6 py-3 rounded-full font-bold uppercase text-sm tracking-wider"
        >
          Acessar Painel
        </div>
      </button>
    </div>

    <footer class="mt-16 text-xs text-slate-500 tracking-widest uppercase">
      Code Adventure • Learning by Playing
    </footer>
  </section>
</main>
