@if (showDialog()) {
<app-game-dialog
  [title]="dialogData().title"
  [message]="dialogData().message"
  [buttonText]="dialogData().buttonText"
  [confirm]="confirm()"
  [showCancel]="showCancel()"
  (close)="onDialogClose($event)"
/>
}

<main
  class="min-h-screen w-full bg-blue-300 flex flex-col items-center justify-between px-4 py-3 sm:p-6 font-sans overflow-x-hidden"
>
  <header class="w-full flex justify-center pt-4">
    <div class="bg-orange-600 border-4 border-orange-800 px-12 py-3 rounded-2xl shadow-xl">
      <h1 class="text-white text-3xl md:text-4xl font-black uppercase tracking-tight text-center">
        Ilha dos Desafios
      </h1>
    </div>
  </header>

  <div
    class="relative w-full max-w-5xl flex-grow my-4 sm:my-8 bg-[#94d66d] rounded-[40px] sm:rounded-[100px] border-4 sm:border-8 border-[#b4e695] border-b-[10px] sm:border-b-[20px] border-[#5da13a] shadow-2xl overflow-hidden"
  >
    <div class="absolute top-4 left-4 sm:top-10 sm:left-10 text-3xl sm:text-5xl opacity-40">🌴</div>
    <div class="absolute bottom-4 right-4 sm:bottom-10 sm:right-10 text-3xl sm:text-5xl opacity-40">
      🌴
    </div>

    <div class="absolute inset-0">
      @for (level of levels; track level.id) {
      <button
        (click)="navigateToLevel(level.id, level.status !== 'locked')"
        [disabled]="level.status === 'locked'"
        [ngStyle]="{ top: level.top, left: level.left }"
        class="absolute -translate-x-1/2 -translate-y-1/2 w-11 h-11 sm:w-14 sm:h-14 md:w-16 md:h-16 border-2 sm:border-4 rounded-full flex items-center justify-center text-base sm:text-xl md:text-2xl font-black transition-all z-10"
        [ngClass]="{
          'bg-blue-500 border-blue-700 hover:scale-110 active:scale-95 shadow-[0_6px_0_0_rgba(29,78,216,1)] cursor-pointer':
            level.status === 'unlocked',
          'bg-green-500 border-green-700 shadow-[0_6px_0_0_rgba(21,128,61,1)]':
            level.status === 'completed',
          'bg-gray-400 border-gray-500 opacity-60 cursor-not-allowed shadow-[0_6_0_0_rgba(107,114,128,1)]':
            level.status === 'locked'
        }"
      >
        @if (level.status === 'locked') {
        <span class="text-xl">🔒</span>
        } @else if (level.status === 'completed') {
        <span>⭐</span>
        } @else {
        <span>{{ level.id }}</span>
        }
      </button>
      }

      <div
        class="absolute top-1/2 right-3 sm:right-6 md:right-10 -translate-y-1/2 text-3xl sm:text-4xl md:text-5xl animate-pulse"
      >
        🚩
      </div>
    </div>
  </div>

  <footer class="pb-4 flex flex-wrap justify-center gap-3 sm:gap-4">
    <button
      routerLink="/welcome"
      class="bg-white/80 hover:bg-white text-blue-800 font-bold py-2 px-8 rounded-full shadow-md transition-colors flex items-center gap-2"
    >
      <span>⬅</span>
      Voltar para o Início
    </button>

    <button
      (click)="confirmResetProgress()"
      class="bg-red-500/80 hover:bg-red-500 text-white font-bold py-2 px-6 rounded-full shadow-md transition-colors flex items-center gap-2"
    >
      <span>🗑️</span>
      Reiniciar Progresso
    </button>
  </footer>
</main>
